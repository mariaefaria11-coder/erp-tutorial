<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Commerce | Produtos</title>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("erpTheme_v2") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="produtos">
  <div class="app-shell">
    
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">EC</div>
    <div><strong>ERP Commerce</strong><span>Gestão integrada</span></div>
  </div>
  <nav class="nav" id="navMain">
    <a href="dashboard.html" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</a>
    <a href="produtos.html" data-page="produtos"><span class="nav-icon">□</span>Produtos</a>
    <a href="pedidos.html" data-page="pedidos"><span class="nav-icon">≡</span>Pedidos</a>
    <a href="clientes.html" data-page="clientes"><span class="nav-icon">◎</span>Clientes</a>
    <a href="tutorial.html" data-page="tutorial"><span class="nav-icon">?</span>Tutorial</a>
  </nav>
  <div class="sidebar-footer">
    <a class="sidebar-button" href="tutorial.html">❔ Tutorial e ajuda</a>
    <button class="sidebar-button" data-theme-toggle><span data-theme-icon>☾</span> <span data-theme-label>Modo escuro</span></button>
  </div>
</aside>
<div class="mobile-sidebar-backdrop"></div>

    <main class="main">
      
<header class="topbar">
  <div class="topbar-title">
    <button class="icon-button mobile-menu" data-mobile-menu aria-label="Abrir menu">☰</button>
    <div><h1>Produtos</h1><p>Catálogo, preços e controle de estoque</p></div>
  </div>
  <div class="topbar-actions">
    <button class="button button-primary" id="addProductButton">＋ <span class="desktop-label">Novo produto</span></button>
    <button class="icon-button" data-theme-toggle aria-label="Alternar tema"><span data-theme-icon>☾</span></button>
    <a class="button button-secondary" href="tutorial.html">❔ <span class="desktop-label">Tutorial</span></a>
    <div class="avatar" title="Administrador">AD</div>
  </div>
</header>

      <div class="content">
        <section class="card">
          <div class="table-tools" id="productTools">
            <div class="search-wrap">
              <span class="search-icon">⌕</span>
              <input class="form-control" id="productSearch" placeholder="Pesquisar por nome ou SKU...">
            </div>
            <select class="select-control" id="productFilter">
              <option value="">Todos os status</option>
              <option>Ativo</option>
              <option>Estoque baixo</option>
              <option>Sem estoque</option>
            </select>
          </div>
          <div class="table-wrap" id="productTable">
            <table>
              <thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="productBackdrop" data-close-product></div>
  <section class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
    <div class="modal-header">
      <h3 id="productModalTitle">Cadastrar produto</h3>
      <button class="icon-button" data-close-product aria-label="Fechar">✕</button>
    </div>
    <form id="productForm">
      <input type="hidden" id="productId" name="id">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group full"><label>Nome do produto</label><input class="form-control" name="name" required placeholder="Ex.: Mouse sem fio"></div>
          <div class="form-group"><label>SKU</label><input class="form-control" name="sku" required placeholder="MOU-001"></div>
          <div class="form-group"><label>Categoria</label><select class="form-control" name="category" required><option>Eletrônicos</option><option>Acessórios</option><option>Informática</option><option>Wearables</option></select></div>
          <div class="form-group"><label>Preço</label><input class="form-control" name="price" type="number" step="0.01" min="0" required></div>
          <div class="form-group"><label>Estoque</label><input class="form-control" name="stock" type="number" min="0" required></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="button button-secondary" data-close-product>Cancelar</button>
        <button type="submit" class="button button-primary">Salvar</button>
      </div>
    </form>
  </section>

  

<div class="toast-container"></div>

  
<script src="../js/data.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/app.js"></script>
<script src="../js/tutorial.js"></script>


  <!-- VLibras: tradução automática do conteúdo para Libras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>

</body>
</html>
